# CI pipeline — repository-structure.md §8.
#
# Gate order matters: the cheap structural gates run before the expensive ones,
# so a boundary violation fails in seconds rather than after a container build.
#
# Every gate below corresponds to a documented rule. A gate that cannot name the
# rule it enforces does not belong here.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  KNOWZY_ENV: test
  NODE_VERSION: '22'

jobs:
  # -------------------------------------------------------------------------
  # Static gates: typecheck, boundaries, codegen parity, unit and contract
  # tests. No database, no containers.
  # -------------------------------------------------------------------------
  static:
    name: static gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Frozen lockfile (repository-structure.md §6).
      - name: install
        run: npm ci --no-audit --no-fund

      - name: prisma client
        run: npm run db:generate

      # 0002_init is generated once per clone and committed. Its absence is a
      # setup error, not something CI should paper over by generating it.
      - name: assert generated init migration is committed
        run: |
          if [ ! -f packages/database/prisma/migrations/0002_init/migration.sql ]; then
            echo "::error::packages/database/prisma/migrations/0002_init/migration.sql is missing."
            echo "Run: npm run -w @knowzy/database bootstrap:init-migration && commit the result."
            exit 1
          fi

      - name: typecheck
        run: npm run typecheck

      - name: format check
        run: npm run format:check

      # Content rules C1–C8 (repository-structure.md §5.2).
      - name: lint
        run: npm run lint

      # Import-graph rules B1–B10 (§5.1). Transitive, which is what B3 requires.
      - name: boundaries
        run: npm run lint:boundaries

      # G6 — the generated contract must match the Zod validators.
      - name: codegen parity
        run: npm run codegen:check

      - name: unit tests
        run: npm run test:unit

      # Includes the planted-violation suite, which proves the boundary rules
      # actually reject something, and the answer-key contract (K2).
      - name: contract tests
        run: npm run test:contract

  # -------------------------------------------------------------------------
  # Integration: a real migrated PostgreSQL. Proves the schema migrates
  # forward from empty and that the audit/state transaction coupling holds.
  # -------------------------------------------------------------------------
  integration:
    name: integration (migrated postgres)
    runs-on: ubuntu-latest
    needs: static
    services:
      postgres:
        # pgvector image: migration 0001 creates the extension. The column is
        # reserved and unused in release 1 (ADR-008).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: knowzy
          POSTGRES_PASSWORD: knowzy
          POSTGRES_DB: knowzy
          PGTZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U knowzy -d knowzy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://knowzy:knowzy@localhost:5432/knowzy?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: install
        run: npm ci --no-audit --no-fund

      - name: prisma client
        run: npm run db:generate

      # Exit criterion: the full schema migrates forward from empty, including
      # partitions, triggers, rules, partial indexes, and CHECK constraints.
      - name: migrate from empty
        run: npm run db:migrate

      - name: migration status is clean
        run: npm run -w @knowzy/database prisma:migrate:status

      # Drift detection: the checked-in migrations must produce exactly the
      # schema in schema.prisma. This is the gate that catches a hand-written
      # migration (0001 or 0003) diverging from the model, which would
      # otherwise surface as a confusing runtime error much later.
      #
      # Replaying migrations needs a scratch database of its own.
      - name: create shadow database
        run: |
          PGPASSWORD=knowzy psql -h localhost -U knowzy -d knowzy -c "CREATE DATABASE knowzy_shadow OWNER knowzy;"

      - name: assert no schema drift
        working-directory: packages/database
        run: |
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
          echo "no drift between checked-in migrations and schema.prisma"
        env:
          SHADOW_DATABASE_URL: postgresql://knowzy:knowzy@localhost:5432/knowzy_shadow?schema=public

      # Seeds are idempotent: running twice must change nothing and must not
      # fail on a unique constraint.
      # Seeded as `local`: under the job's `test` environment the seed skips
      # the local identities AND the mock source (V2), so the fixture sync
      # below had no one to act as and nothing to synchronize -- it answered
      # 401 "No authenticated subject" -- and the suites lacked the identities
      # they read. This database is the job's own throwaway; the stub issuer
      # still refuses to run anywhere but `local`.
      - name: seed
        env:
          KNOWZY_ENV: local
        run: npm run db:seed

      - name: seed is idempotent
        env:
          KNOWZY_ENV: local
        run: npm run db:seed

      # Synchronize the fixture documents.
      #
      # The seed creates the mock SOURCE and deliberately leaves it UNTESTED
      # with no documents — connection health is never inferred
      # (knowledge-source-administration.md §5.4 rule 1). Documents exist only
      # after a synchronize, and three integration suites need an EXTRACTED
      # document to review, approve, publish, and assess against.
      #
      # Until this step existed those 152 tests could only pass on a machine
      # where somebody had synchronized by hand; on a fresh database their
      # `beforeAll` threw and vitest skipped the lot, which reads in the summary
      # very much like success. The first CI run is what found it.
      #
      # The sync runs through the real path — API to MCP to adapter — rather
      # than a fixture script, because a test fixture that reimplements the
      # thing under test drifts from it silently. Both services run in the
      # background for the length of this step only.
      #
      # KNOWZY_ENV=local for these two processes, and only these: the mock
      # adapters are registered in `local` alone (the registry throws
      # elsewhere) and MOCK_FIXTURE_ROOT is forbidden outside it by the startup
      # validator. The tests themselves still run under the job's `test`
      # environment.
      # Every @knowzy/* package resolves through its exports to dist/, and a
      # fresh checkout has none, so the api and mcp started below could not
      # load their packages. tsc -b builds the solution in dependency order.
      - name: build packages
        run: npx tsc -b

      # As the Authoring Administrator: since the Authoring Role Simplification
      # (2026-10-07) every other local identity is deprovisioned and refused,
      # which read here as "never became ready". The MOCK source by name: the
      # seed creates four, and the file-repository ones have no folder in CI.
      - name: synchronize fixture documents
        env:
          KNOWZY_ENV: local
          MOCK_FIXTURE_ROOT: ./fixtures/knowledge
          MCP_ENDPOINT: http://127.0.0.1:8081
        run: |
          npx tsx apps/mcp-server/src/index.ts > /tmp/mcp.log 2>&1 &
          npx tsx apps/api/src/index.ts > /tmp/api.log 2>&1 &

          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/internal/health/ready > /dev/null               && curl -sf -H 'x-knowzy-subject: knowzy-administrator@local.invalid'                  http://127.0.0.1:8080/api/v1/authoring/sources > /dev/null; then
              echo "mcp and api are answering"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "::error::mcp or api never became ready; logs follow"
              # What each probe actually answered: a refusal is not a hang.
              curl -s -w ' [mcp HTTP %{http_code}]' http://127.0.0.1:8081/internal/health/ready || true
              echo
              curl -s -w ' [api HTTP %{http_code}]' -H 'x-knowzy-subject: knowzy-administrator@local.invalid' http://127.0.0.1:8080/api/v1/authoring/sources | head -c 1500 || true
              echo
              tail -n 40 /tmp/mcp.log /tmp/api.log
              exit 1
            fi
            sleep 2
          done

          SOURCE_ID=$(curl -sf -H 'x-knowzy-subject: knowzy-administrator@local.invalid'             http://127.0.0.1:8080/api/v1/authoring/sources             | python3 -c 'import json,sys; print(next(s["sourceId"] for s in json.load(sys.stdin)["sources"] if s["name"] == "Mock Support Operations"))')

          # No content-type on the bodyless POST: Fastify rejects an empty body
          # when one is declared.
          curl -sf -X POST -H 'x-knowzy-subject: knowzy-administrator@local.invalid'             "http://127.0.0.1:8080/api/v1/authoring/sources/$SOURCE_ID/test-connection" > /dev/null

          curl -sf -X POST -H 'x-knowzy-subject: knowzy-administrator@local.invalid'             -H 'content-type: application/json' -d '{"mode":"FULL"}'             "http://127.0.0.1:8080/api/v1/authoring/sources/$SOURCE_ID/synchronize"             | python3 -c 'import json,sys; d=json.load(sys.stdin); print(f"sync {d[\"outcome\"]}: scanned {d[\"scanned\"]}, added {d[\"added\"]}, {d[\"extractedChars\"]} characters extracted"); sys.exit(0 if d["outcome"] == "SUCCEEDED" else 1)'

      # The suites above cannot run without the documents the previous step
      # creates, so assert the precondition rather than discovering it as a
      # skipped test.
      - name: assert the fixtures are present
        run: |
          COUNT=$(PGPASSWORD=knowzy psql -h localhost -U knowzy -d knowzy -At             -c "SELECT count(*) FROM knowledge_document WHERE extraction_status = 'EXTRACTED';")
          echo "extracted documents: $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No extracted document exists, so the domain integration suites would skip themselves."
            exit 1
          fi

      # Includes the audit rollback suite and the append-only enforcement.
      - name: integration tests
        run: npm run test:integration

  # -------------------------------------------------------------------------
  # Images. Built once, scanned, and (on main) published by digest.
  # -------------------------------------------------------------------------
  images:
    name: build images
    runs-on: ubuntu-latest
    needs: static
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: infrastructure/docker/Dockerfile.service
          - app: mcp-server
            dockerfile: infrastructure/docker/Dockerfile.service
          - app: jobs
            dockerfile: infrastructure/docker/Dockerfile.service
          - app: authoring-web
            dockerfile: infrastructure/docker/Dockerfile.web
          - app: live-web
            dockerfile: infrastructure/docker/Dockerfile.web
          - app: sync-web
            dockerfile: infrastructure/docker/Dockerfile.web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: build ${{ matrix.app }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            APP=${{ matrix.app }}
          # Pushing by digest happens in the release workflow, not on a PR.
          push: false
          load: true
          tags: knowzy/${{ matrix.app }}:ci
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # security.md §14: a high or critical finding fails the pipeline.
      #
      # The tag carries the `v`. Written as `0.24.0` this action does not
      # resolve, and GitHub resolves every action in a job BEFORE running any
      # step — so all five matrix legs failed in three seconds, before a single
      # layer was built, with the build itself never exercised.
      - name: scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: knowzy/${{ matrix.app }}:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          # The same register as the npm audit gate: every id in .trivyignore
          # is an advisory classified in docs/SECURITY-EXCEPTIONS.md with a
          # reason and an expiry. Nothing is suppressed without an entry.
          trivyignores: .trivyignore

  # -------------------------------------------------------------------------
  # Dependency and license gates — security.md §14.
  # -------------------------------------------------------------------------
  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: install
        run: npm ci --no-audit --no-fund

      # security.md §14 fails the build on a high or critical finding. The gate
      # below keeps that rule and adds one narrow escape: an advisory named in
      # docs/SECURITY-EXCEPTIONS.md by a dated, reasoned, non-reachable entry.
      # An undeclared advisory, an expired entry, a reachable one, or an entry
      # that matches nothing all still fail. Asserted by
      # packages/testing/src/audit-exceptions.test.ts.
      - name: dependency audit
        run: npm run audit:gate

      - name: sbom
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json --omit dev

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 90
